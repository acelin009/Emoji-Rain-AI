[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-rain-ai"
version = "1.0.0"
description = "Real-time facial expression detection with an animated emoji particle rain, powered by MediaPipe Face Mesh."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Emoji Rain AI Contributors" }
]
keywords = ["computer-vision", "mediapipe", "opencv", "emoji", "facial-expression", "particle-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "opencv-python==4.10.0.84",
    "mediapipe==0.10.14",
    "numpy==1.26.4",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "mypy==1.11.2",
]

[project.scripts]
emoji-rain-ai = "app:main"

[project.urls]
Homepage = "https://github.com/your-org/Emoji-Rain-AI"
Repository = "https://github.com/your-org/Emoji-Rain-AI"
Issues = "https://github.com/your-org/Emoji-Rain-AI/issues"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
